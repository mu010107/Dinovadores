<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070a">
<title>Dinovadores | FESC - Objetivo Mogi</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#f4f5f7;background:radial-gradient(circle at 50% -10%,rgba(126,87,194,.18),transparent 34rem),linear-gradient(180deg,#090c12 0%,#05070a 30%,#020304 100%)}
.page{width:min(1180px,calc(100% - 24px));margin:auto;padding:34px 0 54px}
header{text-align:center;padding:22px 12px 36px}
.eyebrow{margin:0 0 10px;color:#d2b8ff;font-size:clamp(.78rem,2.5vw,.95rem);font-weight:800;letter-spacing:.28em;text-transform:uppercase}
h1{margin:0;font-size:clamp(2rem,8vw,4.7rem);line-height:.98;letter-spacing:.03em;text-transform:uppercase}
.subtitle{max-width:760px;margin:18px auto 0;color:#b7bec9;font-size:clamp(1rem,3.6vw,1.3rem);line-height:1.55}
.divider{width:min(440px,70%);height:1px;margin:26px auto 0;background:linear-gradient(90deg,transparent,#b992ff,transparent)}
main{display:grid;gap:18px}
.era-card{display:block;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:#0a0e14;box-shadow:0 18px 52px rgba(0,0,0,.38);text-decoration:none;transition:.22s}
.era-card:hover,.era-card:focus-visible{transform:translateY(-4px);border-color:rgba(199,164,255,.5);box-shadow:0 24px 64px rgba(0,0,0,.52);outline:none}
.era-card img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
footer{padding:34px 10px 0;color:#8f98a6;text-align:center;font-size:.86rem}
@media(max-width:640px){.page{width:min(100% - 14px,1180px);padding-top:18px}header{padding-bottom:26px}main{gap:12px}.era-card{border-radius:13px}}
</style>
</head>
<body>
<div class="page">
<header>
  
<p class="eyebrow">Projeto Dinovadores</p>

<h1>
  <span>FESC</span>
  <span>Objetivo Mogi</span>
</h1>
  
<p class="subtitle">Uma jornada educativa pelas eras geológicas e pela evolução da vida na Terra.</p>
<div class="divider"></div>
</header>
<main>
<a class="era-card" href="precambriana/"><img src="assets/precambriana.png" alt="Era Pré-Cambriana"></a>
<a class="era-card" href="paleozoica/"><img src="assets/paleozoica.png" alt="Era Paleozoica" loading="lazy"></a>
<a class="era-card" href="mesozoica/"><img src="assets/mesozoica.png" alt="Era Mesozoica" loading="lazy"></a>
<a class="era-card" href="cenozoica/"><img src="assets/cenozoica.png" alt="Era Cenozoica" loading="lazy"></a>
</main>
<footer>Trabalho escolar sobre a história geológica da Terra.</footer>
</div>
</body>
</html>
