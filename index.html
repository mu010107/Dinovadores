<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projeto Dinovadores</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;

background:
linear-gradient(180deg,#111426,#05070a);

color:white;

}

header{

padding:40px 20px 35px;

text-align:center;

}

header h2{

color:#cda7ff;

letter-spacing:6px;

font-size:18px;

margin-bottom:18px;

}

header h1{

display:flex;

flex-direction:column;

align-items:center;

line-height:1;

font-size:56px;

font-weight:900;

text-transform:uppercase;

}

header p{

margin-top:25px;

font-size:24px;

line-height:1.5;

color:#d0d0d0;

max-width:900px;

margin-left:auto;

margin-right:auto;

}

.linha{

width:320px;

height:1px;

background:#6d5b94;

margin:30px auto;

opacity:.5;

}

main{

width:95%;

max-width:1200px;

margin:auto;

padding-bottom:50px;

}

.card{

display:block;

margin-bottom:25px;

border-radius:24px;

overflow:hidden;

border:1px solid rgba(255,255,255,.15);

transition:.25s;

}

.card:hover{

transform:scale(1.01);

}

.card img{

display:block;

width:100%;

height:auto;

}

@media(max-width:700px){

header h1{

font-size:48px;

}

header p{

font-size:18px;

}

}

</style>

</head>

<body>

<header>

<h2>PROJETO DINOVADORES</h2>

<h1>

<span>FESC</span>

<span>OBJETIVO MOGI</span>

</h1>

<p>

Uma jornada educativa pelas eras geológicas e pela evolução da vida na Terra.

</p>

<div class="linha"></div>

</header>

<main>

<a class="card" href="precambriana/">
<img src="assets/precambriana.png">
</a>

<a class="card" href="paleozoica/">
<img src="assets/paleozoica.png">
</a>

<a class="card" href="mesozoica/">
<img src="assets/mesozoica.png">
</a>

<a class="card" href="cenozoica/">
<img src="assets/cenozoica.png">
</a>

</main>

</body>

</html>
