<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Teste AR - Orbitando o Pote</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-marker preset="hiro">

        <a-box position="0 0.5 0" scale="1.5 1 1.5" material="colorWrite: false;"></a-box>

        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;">
          
          <a-box position="2 0.5 0" scale="0.4 0.4 0.4" color="#228B22"></a-box>

        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
