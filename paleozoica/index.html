<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Teste AR 'Top' - Dinovadores</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="volcaoModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Volcano/glTF/Volcano.gltf"></a-asset-item>
        <a-asset-item id="trexModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/TyrannosaurusRex/glTF/TyrannosaurusRex.gltf"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-entity gltf-model="#volcaoModel" position="0 0.5 0" scale="0.2 0.2 0.2" rotation="0 90 0"></a-entity>
        <a-text value="VULCÃO ATIVO" position="-1 2 -2" color="red" scale="1 1 1"></a-text>
      </a-marker>

      <a-marker preset="kanji">
        <a-entity gltf-model="#trexModel" position="0 0.2 0" scale="0.5 0.5 0.5" rotation="0 90 0"></a-entity>
        <a-text value="TYRANNOSAURUS REX" position="-1.5 2 -2" color="orange" scale="1 1 1"></a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
