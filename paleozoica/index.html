<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinovadores | Experiência Premium</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #FF4500;
      --bg-dark: #121212;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }
    
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--bg-dark);
      font-family: 'Poppins', sans-serif;
      color: white; overflow: hidden;
    }
    
    /* Cabeçalho Premium */
    .header {
      position: absolute; top: 0; left: 0; width: 100%;
      padding: 25px 20px; box-sizing: border-box; z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }
    .header h1 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: 1px; }
    .header span { color: var(--primary); }
    .header p { margin: 5px 0 0 0; font-size: 0.85rem; color: #ccc; font-weight: 400; }
    
    /* O Visualizador 3D cobrindo a tela toda */
    model-viewer {
      width: 100%; height: 100%; outline: none;
      background: radial-gradient(circle at center, #2a2a2a 0%, #121212 100%);
    }
    
    /* Painel Flutuante estilo "Glassmorphism" (Vidro) */
    .ui-panel {
      position: absolute; bottom: 40px; left: 50%;
      transform: translateX(-50%); width: 85%; max-width: 400px;
      background: var(--glass-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 10;
      text-align: center;
    }
    .ui-panel h2 { margin: 0 0 5px 0; font-size: 1.4rem; font-weight: 600; }
    .ui-panel p { margin: 0 0 20px 0; font-size: 0.9rem; color: #bbb; }
    
    /* Botão de Realidade Aumentada customizado */
    .ar-button {
      background-color: var(--primary); color: white;
      border: none; border-radius: 30px; padding: 15px 30px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
      transition: all 0.3s ease; width: 100%; letter-spacing: 0.5px;
    }
    .ar-button:hover { background-color: #ff5e22; transform: translateY(-2px); }
    
    /* Esconde o botão padrão feio do model-viewer */
    model-viewer::part(default-ar-button) { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>DINO<span>VADORES</span></h1>
    <p>FESC 2026 • Colégio Objetivo</p>
  </div>

  <model-viewer 
    id="dino-viewer"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    rotation-per-second="30deg"
    shadow-intensity="1.5"
    exposure="1.1">
  </model-viewer>

  <div class="ui-panel">
    <h2>Era Mesozoica</h2>
    <p>O apogeu dos grandes répteis e a dominação do superpredador na Terra.</p>
    
    <button class="ar-button" onclick="document.querySelector('#dino-viewer').activateAR()">
      Ver no meu ambiente
    </button>
  </div>

</body>
</html>
