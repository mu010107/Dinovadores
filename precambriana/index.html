<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Dinovadores - 360 Graus</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      
      <a-sky src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Equirectangular_projection_of_the_surface_of_Mars_based_on_Viking_mosaics.jpg/1024px-Equirectangular_projection_of_the_surface_of_Mars_based_on_Viking_mosaics.jpg"></a-sky>

      <a-text value="BEM-VINDO A ERA PRE-CAMBRIANA" position="-2 2 -4" color="white" scale="1.5 1.5 1.5"></a-text>

      <a-box position="0 1 -3" rotation="0 45 0" color="#ff4500" animation="property: rotation; to: 0 405 0; loop: true; dur: 5000"></a-box>

    </a-scene>
  </body>
</html>
