<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR - Vulcões Pré-Cambrianos</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sky color="#8B2500"></a-sky>

      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#1C1C1C"></a-plane>

      <a-cone position="0 0 -10" radius-bottom="6" radius-top="1" height="8" color="#2F1B12"></a-cone>
      <a-sphere position="0 4.2 -10" radius="1.2" color="#FF4500" material="emissive: #FF0000; emissiveIntensity: 1"></a-sphere>

      <a-cone position="-12 0 -2" radius-bottom="8" radius-top="1.5" height="10" color="#24150E"></a-cone>
      <a-sphere position="-12 5.2 -2" radius="1.7" color="#FF3030" material="emissive: #FF0000; emissiveIntensity: 1"></a-sphere>

      <a-cone position="10 0 -5" radius-bottom="5" radius-top="0.8" height="6" color="#382116"></a-cone>
      <a-sphere position="10 3.2 -5" radius="1" color="#FF4500" material="emissive: #FF4500; emissiveIntensity: 0.8"></a-sphere>

      <a-cone position="3 0 12" radius-bottom="7" radius-top="1.2" height="9" color="#1A0F0A"></a-cone>
      <a-sphere position="3 4.7 12" radius="1.4" color="#FF3300" material="emissive: #FF0000; emissiveIntensity: 1"></a-sphere>

      <a-text value="ERA PRE-CAMBRIANA" position="-1.7 2 -4" color="#FFD700" scale="1.5 1.5 1.5"></a-text>
      <a-text value="Olhe ao seu redor!" position="-1 1.5 -4" color="#FFFFFF" scale="1 1 1"></a-text>

      <a-camera position="0 1.6 0"></a-camera>

    </a-scene>
  </body>
</html>
